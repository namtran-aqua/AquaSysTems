<!DOCTYPE html>

<head>

    <base href="/" />
    <!-- Tắt Google Translate để tránh làm lỗi Blazor DOM -->

    <!-- CSS -->
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" href="assets/logoaqua.png" type="image/x-icon" />

    <link href="_content/AntDesign.ProLayout/css/ant-design-pro-layout-blazor.css" rel="stylesheet" />

    <style>
        html, body {
            overflow-x: hidden;

<body>
    <div id="app" style="overflow-x:hidden">
        <img src="https://hrmsaquavietnam.com:6969/images/Aqua-Smart%20Home%20-%20blue.png"
             alt="AQUA Logo"
             style="width:120px;height:auto;margin-bottom:24px;" />
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- ✅ Script phải đặt CUỐI BODY -->
    <!-- Custom JS -->
    <script>
        window.setupUserDropdown = function () {
            const dropdown = document.getElementById("userDropdown");
            if (!dropdown) return;

            const toggle = dropdown.querySelector(".user-dropdown-toggle");

            toggle?.addEventListener("click", function (e) {
                e.stopPropagation();
                dropdown.classList.toggle("open");
            });

            document.addEventListener("click", function (e) {
                if (!dropdown.contains(e.target)) {
                    dropdown.classList.remove("open");
                }
            });
        };
    </script>

    <!-- Zoom -->
    <script src="js/zoom-handler.js"></script>

    <!-- ✅ Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

    <!-- ✅ Chart custom -->
    <!--<script src="js/reportCharts.js"></script>-->

    <!-- Ant Design -->
    <script src="_content/AntDesign/js/ant-design-blazor.js"></script>

    <!-- ✅ Blazor ALWAYS LAST -->
    <script src="_framework/blazor.webassembly.js"></script>

</body>
